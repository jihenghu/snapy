# Fixture for tests/test_species_face_clamp.cpp -- one card for the whole
# binary. A row along x2 with one vapor species, WENO5 with shock and scale on
# (the TJ16 species deck's reconstruct) and the EOS limiter on.
reference-state:
  Tref: 300.
  Pref: 1.e5

species:
  - name: dry
    composition: {O: 0.42, N: 1.56, Ar: 0.01}
    cv_R: 2.5

  - name: vapor
    composition: {H: 2, O: 1}
    cv_R: 2.5
    u0_R: 0.

  - name: cloud
    composition: {H: 2, O: 1}
    cv_R: 9.0
    u0_R: -3430.

reactions:
  - equation: vapor <=> cloud
    type: nucleation
    rate-constant: {formula: h2o_ideal}

geometry:
  type: cartesian
  bounds: {x1min: 0., x1max: 4., x2min: 0., x2max: 16., x3min: 0., x3max: 1.}
  cells: {nx1: 4, nx2: 16, nx3: 1, nghost: 3}

dynamics:
  equation-of-state:
    type: ideal-moist
    limiter: true
  reconstruct:
    vertical: {type: weno5, scale: true, shock: true}
    horizontal: {type: weno5, scale: true, shock: true}

boundary-condition:
  external:
    x1-inner: reflecting
    x1-outer: reflecting
    x2-inner: periodic
    x2-outer: periodic
