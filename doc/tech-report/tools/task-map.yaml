# One record per question of the newcomer question bank (merged-newcomer-questions.md, sha256
# 5da6ce52e765d35a5e1027d428dc24abb34ed1603c8b6a297e761e8b5ef7cd1f): the question, its status, and either `dest`,
# the label of the section that answers it best, or `not_provided`, why the book does not answer it.
# status: answered | partly documented | undocumented | unsupported by the code | outside scope
# `missing` says what a partly documented answer lacks. `best_section_unlabeled` names a best section that carries
# no label (dest is then its labelled parent); `lookup_grade` is the evidence of the lookup test. `bank_ids` is the
# range every bank question falls in: tools/tests/test_task_map.py fails when an id of the range is missing or
# repeated, when a status is not one of the five, or when a dest is not a label of the book.
